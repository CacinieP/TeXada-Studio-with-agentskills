name: Windows bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/**
      - scripts/install_local_tools.py
      - scripts/prepare-local-tex.py
      - scripts/run-local-studio.py
      - scripts/start-local-studio.bat
      - webui/**
      - harness/**
      - skills/**
      - samples/docs/**
      - .github/workflows/windows-bundle.yml
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Preserve committed LF line endings before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Detect signing secrets
        id: detect
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build dependencies
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r webui/requirements.txt
          .venv/Scripts/python.exe -m pip install -r desktop/requirements.txt pyinstaller

      - name: Desktop regression on Windows
        shell: bash
        run: .venv/Scripts/python.exe -m unittest discover -s desktop -p 'test_*.py'

      - name: Install Tectonic and Poppler Windows (pinned releases, SHA256 verified)
        shell: bash
        run: |
          .venv/Scripts/python.exe scripts/install_local_tools.py
          .venv/Scripts/python.exe -c "import sys; sys.path.insert(0, 'webui'); import tool_fetch; print(tool_fetch.install_poppler())"

      - name: Prepare TeX resource cache
        shell: bash
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.texada/bin:$(cygpath -u "$USERPROFILE")/.texada/Library/bin:$PATH"
          export TECTONIC_CACHE_DIR="$LOCALAPPDATA/TectonicProject/Tectonic/Cache"
          .venv/Scripts/python.exe scripts/prepare-local-tex.py --download-resources

      - name: Build self-contained Windows bundle
        shell: bash
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.texada/bin:$(cygpath -u "$USERPROFILE")/.texada/Library/bin:$PATH"
          export TECTONIC_CACHE_DIR="$LOCALAPPDATA/TectonicProject/Tectonic/Cache"
          .venv/Scripts/python.exe desktop/build_windows_bundle.py --output dist-win --with-llama-server

      - name: Verify Studio Windows icon and bundle layout
        shell: bash
        run: |
          test -s "dist-win/TeXada Studio/TeXada Studio.exe"
          test -s "dist-win/TeXada Studio/Resources/AppIcon.ico"
          test -s "dist-win/TeXada Studio/Resources/licenses/tex-cache-manifest.sha256"
          test -s "dist-win/TeXada Studio/Resources/licenses/llama.cpp-LICENSE.txt"

      - name: Isolated Windows smoke test (no repo tools, minimal PATH, CJK glyph check)
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve()
          app_dir = Path("dist-win/TeXada Studio").resolve()
          res_dir = app_dir / "Resources"

          # Remove build-step caches/tools so SHGetKnownFolderPath cannot leak build artifacts.
          real_localappdata = Path(os.environ["LOCALAPPDATA"])
          shutil.rmtree(real_localappdata / "TectonicProject", ignore_errors=True)
          shutil.rmtree(Path.home() / ".texada", ignore_errors=True)

          iso_user = runner_temp / "iso-user"
          iso_local = iso_user / "AppData" / "Local"
          iso_roaming = iso_user / "AppData" / "Roaming"
          iso_temp = runner_temp / "iso-temp"
          iso_cache = iso_local / "TectonicProject" / "Tectonic" / "Cache"
          for folder in (iso_roaming, iso_temp, iso_cache.parent):
              folder.mkdir(parents=True, exist_ok=True)
          shutil.copytree(res_dir / "tex-cache", iso_cache)

          sys_root = os.environ.get("SystemRoot") or r"C:\Windows"
          iso_env = {
              "SystemRoot": sys_root,
              "WINDIR": sys_root,
              "PATH": f"{sys_root}\\System32;{sys_root}",
              "USERPROFILE": str(iso_user),
              "LOCALAPPDATA": str(iso_local),
              "APPDATA": str(iso_roaming),
              "TEMP": str(iso_temp),
              "TMP": str(iso_temp),
              "TECTONIC_CACHE_DIR": str(iso_cache),
              "PYTHONUTF8": "1",
          }

          for exe_rel, flag in (
              (res_dir / "bin" / "tectonic.exe", "--version"),
              (res_dir / "Library" / "bin" / "pdfinfo.exe", "-v"),
              (res_dir / "Library" / "bin" / "pdftoppm.exe", "-v"),
              (res_dir / "bin" / "llama-server.exe", "--version"),
          ):
              out = subprocess.run(
                  [str(exe_rel), flag],
                  env=iso_env,
                  capture_output=True,
                  text=True,
                  check=True,
              )
              print(exe_rel.name, (out.stdout + out.stderr).strip().splitlines()[0])

          verify_out = subprocess.run(
              [
                  str(app_dir / "TeXada Studio.exe"),
                  str(res_dir / "skills" / "doc-formula-verify" / "scripts" / "verify.py"),
                  "x^2+1",
              ],
              env=iso_env,
              capture_output=True,
              text=True,
              check=True,
          )
          verify_payload = json.loads(verify_out.stdout.strip().splitlines()[-1])
          assert verify_payload.get("status") == "OK", verify_payload

          work = runner_temp / "smoke"
          out_dir = work / "out"
          out_dir.mkdir(parents=True, exist_ok=True)
          smoke_tex = work / "smoke.tex"
          smoke_tex.write_text(
              "\\documentclass{article}\n\\usepackage{amsmath}\n\\begin{document}\n$x^2+1$\n\\end{document}\n",
              encoding="utf-8",
          )
          subprocess.run(
              [str(res_dir / "bin" / "tectonic.exe"), "--untrusted", "--only-cached", "-o", str(out_dir), str(smoke_tex)],
              env=iso_env,
              check=True,
          )
          assert (out_dir / "smoke.pdf").is_file(), "smoke.pdf missing"

          for variant, body in (("cjk", "微积分笔记"), ("blank", r"\phantom{微积分笔记}")):
              tex_file = work / f"{variant}.tex"
              tex_file.write_text(
                  "\\documentclass[UTF8,fontset=fandol]{ctexart}\n"
                  "\\pagestyle{empty}\n\\begin{document}\n"
                  f"{body}\n\\end{{document}}\n",
                  encoding="utf-8",
              )
              subprocess.run(
                  [str(res_dir / "bin" / "tectonic.exe"), "--untrusted", "--only-cached", "-o", str(out_dir), str(tex_file)],
                  env=iso_env,
                  check=True,
              )
              subprocess.run(
                  [
                      str(res_dir / "Library" / "bin" / "pdftoppm.exe"),
                      "-f", "1", "-l", "1", "-png", "-r", "100", "-singlefile",
                      str(out_dir / f"{variant}.pdf"),
                      str(out_dir / variant),
                  ],
                  env=iso_env,
                  check=True,
              )
              assert (out_dir / f"{variant}.png").stat().st_size > 0, f"{variant}.png empty"

          cjk_bytes = (out_dir / "cjk.png").read_bytes()
          blank_bytes = (out_dir / "blank.png").read_bytes()
          if cjk_bytes == blank_bytes:
              raise SystemExit("Bundled Windows Poppler dropped all CJK glyphs!")

          # Verify all 5 built-in templates and representative samples compile strictly offline.
          tpl_json = subprocess.run(
              [
                  "node", "-e",
                  "const t=require(require('path').resolve(process.argv[1])); console.log(JSON.stringify(t.list()));",
                  str(res_dir / "webui" / "static" / "editor" / "templates.js"),
              ],
              capture_output=True, text=True, encoding="utf-8", check=True,
          ).stdout
          offline_sources = []
          for tpl in json.loads(tpl_json):
              tpl_path = work / f"tpl-{tpl['id']}.tex"
              tpl_path.write_text(tpl["content"], encoding="utf-8")
              offline_sources.append(tpl_path)
          for sample_name in ("welcome.tex", "clean-control.tex", "math-clean.tex", "math-semantics.tex", "report-01.tex"):
              offline_sources.append(res_dir / "samples" / "docs" / sample_name)
          for tex_file in offline_sources:
              subprocess.run(
                  [str(res_dir / "bin" / "tectonic.exe"), "--untrusted", "--only-cached", "-o", str(out_dir), str(tex_file)],
                  env=iso_env,
                  check=True,
              )
              pdf_path = out_dir / (tex_file.stem + ".pdf")
              assert pdf_path.is_file() and pdf_path.stat().st_size > 0, f"{pdf_path} missing"
              print("offline template/sample compile OK:", tex_file.stem)
          print("Isolated Windows CJK compile, templates/samples offline compile, Poppler render, llama-server, and frozen verifier OK.")
          PY

      - name: Sign executable with Authenticode certificate
        if: steps.detect.outputs.has_signing == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              throw "signtool.exe not found on Windows runner"
            }
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PWD /fd SHA256 `
              /tr "http://timestamp.digicert.com" /td SHA256 `
              "dist-win\TeXada Studio\TeXada Studio.exe"
          } finally {
            if (Test-Path $pfxPath) { Remove-Item -Force $pfxPath }
          }

      - name: Package portable ZIP and SHA256 checksum
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile

          dist_dir = Path("dist-win").resolve()
          app_dir = dist_dir / "TeXada Studio"
          zip_path = dist_dir / "TeXada-Studio-Windows-x64.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for item in sorted(app_dir.rglob("*")):
                  if item.is_file():
                      arcname = item.relative_to(dist_dir).as_posix()
                      zf.write(item, arcname)
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          checksum_line = f"{digest}  {zip_path.name}\n"
          (dist_dir / "checksum-windows.txt").write_text(checksum_line, encoding="utf-8")
          print(checksum_line, end="")
          PY

      - name: Upload Windows portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: TeXada-Studio-Windows-x64
          path: |
            dist-win/TeXada-Studio-Windows-x64.zip
            dist-win/checksum-windows.txt
          if-no-files-found: error
