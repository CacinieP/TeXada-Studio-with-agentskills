name: Desktop bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/**
      - scripts/install_local_tools.py
      - scripts/prepare-local-tex.py
      - webui/**
      - harness/**
      - skills/**
      - samples/docs/**
      - .github/workflows/bundle-build.yml
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # ---- 签名与公证:配置了仓库 secrets 时产出公证 DMG;否则回退未签名 zip ----
      - name: Detect signing secrets
        id: detect
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then echo "has_signing=true" >> "$GITHUB_OUTPUT";
          else echo "has_signing=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import signing certificate into a temporary keychain
        if: steps.detect.outputs.has_signing == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          CERTFILE="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode -o "$CERTFILE"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain-db
          security import "$CERTFILE" -k build.keychain-db -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" build.keychain-db
          security list-keychains -d user -s build.keychain-db
          rm -f "$CERTFILE"

      - name: Prepare build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r webui/requirements.txt
          .venv/bin/pip install -r desktop/requirements.txt py2app
      - name: Install Tectonic (pinned official release, SHA256 verified)
        run: |
          .venv/bin/python scripts/install_local_tools.py
          echo "$HOME/.texada/bin" >> "$GITHUB_PATH"
      - name: Install Poppler
        run: brew install poppler
      - name: Prepare TeX resource cache
        run: .venv/bin/python scripts/prepare-local-tex.py --download-resources
      - name: Build self-contained app
        run: .venv/bin/python desktop/build_bundle.py --output dist-app
      - name: Isolated smoke test (no repo, no brew, no network in the test env)
        run: |
          R="dist-app/TeXada Studio.app/Contents/Resources"
          ISOLATED_HOME="$RUNNER_TEMP/iso-home"
          mkdir -p "$ISOLATED_HOME/Library/Caches"
          cp -R "$R/tex-cache" "$ISOLATED_HOME/Library/Caches/TectonicProject.Tectonic"
          env -i HOME="$ISOLATED_HOME" PATH=/usr/bin:/bin "$R/bin/tectonic" --version
          env -i HOME="$ISOLATED_HOME" PATH=/usr/bin:/bin "$R/bin/pdfinfo" -v
          env -i HOME="$ISOLATED_HOME" PATH=/usr/bin:/bin "$R/bin/pdftoppm" -v
          WORK="$RUNNER_TEMP/smoke"
          mkdir -p "$WORK/out"
          printf '\\documentclass{article}\n\\usepackage{amsmath}\n\\begin{document}\n$x^2+1$\n\\end{document}\n' > "$WORK/smoke.tex"
          env -i HOME="$ISOLATED_HOME" PATH=/usr/bin:/bin \
            "$R/bin/tectonic" --untrusted --only-cached -o "$WORK/out" "$WORK/smoke.tex"
          test -f "$WORK/out/smoke.pdf" && echo "isolated compile OK"

      - name: Sign the app with Developer ID Application
        if: steps.detect.outputs.has_signing == 'true'
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain-db | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "证书链中没有 Developer ID Application 身份;无法做分发签名。" >&2
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          .venv/bin/python desktop/sign_bundle.py "dist-app/TeXada Studio.app" --identity "$IDENTITY"

      - name: Store notarytool credentials
        if: steps.detect.outputs.has_signing == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            xcrun notarytool store-credentials NOTARY_PROFILE \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool store-credentials NOTARY_PROFILE \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          else
            echo "缺少公证凭据(ASC_KEY_ID/ASC_ISSUER_ID/ASC_KEY_P8 或 APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID)。" >&2
            exit 1
          fi

      - name: Notarize and staple the app
        if: steps.detect.outputs.has_signing == 'true'
        run: |
          ditto -c -k --keepParent "dist-app/TeXada Studio.app" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" --keychain-profile NOTARY_PROFILE --wait
          xcrun stapler staple "dist-app/TeXada Studio.app"
          xcrun stapler validate "dist-app/TeXada Studio.app"

      - name: Create, sign and notarize the DMG
        if: steps.detect.outputs.has_signing == 'true'
        run: |
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "dist-app/TeXada Studio.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "TeXada Studio" -srcfolder "$STAGE" -ov -format UDZO \
            "dist-app/TeXada-Studio-macOS-arm64.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "dist-app/TeXada-Studio-macOS-arm64.dmg"
          xcrun notarytool submit "dist-app/TeXada-Studio-macOS-arm64.dmg" --keychain-profile NOTARY_PROFILE --wait
          xcrun stapler staple "dist-app/TeXada-Studio-macOS-arm64.dmg"
          xcrun stapler validate "dist-app/TeXada-Studio-macOS-arm64.dmg"
          spctl -a -t open --context context:primary-signature -vv "dist-app/TeXada-Studio-macOS-arm64.dmg"
          cd dist-app
          shasum -a 256 "TeXada-Studio-macOS-arm64.dmg" | tee checksum.txt
      - name: Upload notarized DMG
        if: steps.detect.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TeXada-Studio-macOS-arm64-notarized
          path: |
            dist-app/TeXada-Studio-macOS-arm64.dmg
            dist-app/checksum.txt
          if-no-files-found: error

      - name: Package unsigned fallback (no signing secrets configured)
        if: steps.detect.outputs.has_signing != 'true'
        run: |
          cd dist-app
          ditto -c -k --keepParent "TeXada Studio.app" "TeXada-Studio-macOS-arm64.zip"
          shasum -a 256 "TeXada-Studio-macOS-arm64.zip" | tee checksum.txt
      - name: Upload unsigned zip
        if: steps.detect.outputs.has_signing != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TeXada-Studio-macOS-arm64-unsigned
          path: |
            dist-app/TeXada-Studio-macOS-arm64.zip
            dist-app/checksum.txt
          if-no-files-found: error
