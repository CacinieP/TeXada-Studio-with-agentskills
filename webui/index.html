<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>doc-forensics · 文档解析质检套件</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --ok:#3fb950; --retry:#d29922; --human:#f85149; --accent:#58a6ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"PingFang SC",sans-serif; padding:28px 36px; }
  h1 { font-size:24px; letter-spacing:.5px; }
  h1 small { color:var(--dim); font-size:14px; font-weight:400; margin-left:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; }
  .card h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .kv { font-family:"SF Mono",Menlo,monospace; font-size:14px; white-space:pre-wrap; }
  .btn { background:var(--accent); color:#04121f; border:none; border-radius:8px; padding:10px 22px;
         font-size:15px; font-weight:600; cursor:pointer; margin-right:10px; }
  .btn[disabled] { opacity:.4; cursor:default; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .status { margin:6px 0 14px; font-family:Menlo,monospace; font-size:13px; color:var(--dim); min-height:20px; }
  .doc { margin:12px 0; }
  .doc b { color:var(--accent); font-family:Menlo,monospace; }
  .chip { display:inline-block; padding:1px 10px; margin:3px 6px 3px 0; border-radius:12px;
          font-family:Menlo,monospace; font-size:12.5px; border:1px solid var(--line); }
  .chip.OK { color:var(--ok); border-color:var(--ok); }
  .chip.RETRY { color:var(--retry); border-color:var(--retry); }
  .chip.NEEDS_HUMAN { color:var(--human); border-color:var(--human); }
  .chip.REPAIRED { color:var(--bg); background:var(--ok); border-color:var(--ok); font-weight:700; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  td, th { border-top:1px solid var(--line); padding:6px 8px; text-align:left; font-size:13.5px; }
  code { font-family:"SF Mono",Menlo,monospace; background:#21262d; padding:1px 6px; border-radius:4px; font-size:12.5px; }
  img.crop { width:74px; height:74px; border:1px solid var(--line); border-radius:6px; vertical-align:middle; }
  #report { font-family:"SF Mono",Menlo,monospace; font-size:13px; white-space:pre-wrap; color:var(--fg); }
  .bar { height:8px; background:#21262d; border-radius:4px; overflow:hidden; margin:8px 0 2px; }
  .bar i { display:block; height:100%; background:var(--ok); width:0; transition:width .5s; }
  .hide { display:none; }
  .editor { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
  .pane { background:#0b0f14; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .pane-head { display:flex; justify-content:space-between; align-items:center; background:#11161d;
               padding:5px 12px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--line); }
  .pane-body { padding:10px 12px; }
  .codeline { display:flex; font-family:"SF Mono",Menlo,monospace; font-size:14px; }
  .gutter { color:#484f58; padding-right:10px; text-align:right; user-select:none; min-width:22px; }
  .del { background:rgba(248,81,73,.28); border-radius:3px; padding:0 2px; text-decoration:line-through; }
  .add { background:rgba(63,185,80,.28); border-radius:3px; padding:0 2px; }
  .mathbox { margin-top:8px; padding:10px 12px; background:#11161d; border-radius:6px; overflow-x:auto; }
  .mathbox.bad { outline:1px solid rgba(248,81,73,.5); }
  .mathbox.good { outline:1px solid rgba(63,185,80,.5); }
  .pill { padding:1px 8px; border-radius:10px; font-size:11.5px; }
  .pill.fail { background:rgba(248,81,73,.15); color:var(--human); }
  .pill.pass { background:rgba(63,185,80,.15); color:var(--ok); }
  .renderwrap { text-align:center; padding:8px; }
  .renderwrap img { max-width:100%; background:#fff; border-radius:6px; }
</style>
</head>
<body>
  <h1>doc-forensics <small>文档解析质检套件 · DGX Spark 黑客松 · Agent Skills</small></h1>

  <div class="grid">
    <div class="card"><h3>节点 · NVIDIA GB10</h3><div class="kv" id="gpu">—</div></div>
    <div class="card"><h3>常驻模型 · Ollama</h3><div class="kv" id="models">—</div></div>
  </div>

  <div class="card">
    <h3>流水线控制</h3>
    <button class="btn" id="fresh" onclick="run(true)">▶ 全新运行（含错误注入样本）</button>
    <button class="btn ghost" id="resume" onclick="run(false)">↻ 断点续跑</button>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="status">待机 — 等待指令</div>
    <div class="kv hide" id="log"></div>
  </div>

  <div class="card" id="docsCard">
    <h3>质检节点 · 三态实时</h3>
    <div id="docs"><span style="color:var(--dim)">运行后在此显示各节点 OK / RETRY / NEEDS_HUMAN 状态</span></div>
  </div>

  <div class="card hide" id="repairCard">
    <h3>修复明细 · 证据链</h3>
    <div id="repairs"></div>
  </div>

  <div class="card hide" id="reportCard">
    <h3>质检报告 · report.md</h3>
    <div id="report"></div>
  </div>

<script>
const P = new URLSearchParams(location.search); const T = P.get("token") || "";
const TOTAL_NODES = 8;
let doneShown = false;

async function j(url, opt) { const r = await fetch(url, opt); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function nodeinfo() {
  try { const d = await j(`/api/nodeinfo?token=${T}`);
    gpu.textContent = d.gpu || "—"; models.textContent = d.models || "—";
  } catch (e) { gpu.textContent = "nodeinfo failed"; }
}

async function run(fresh) {
  doneShown = false;
  reportCard.classList.add("hide"); repairCard.classList.add("hide");
  log.classList.remove("hide");
  try { await j(`/api/run?token=${T}&resume=${!fresh}`, { method: "POST" }); }
  catch (e) { status.textContent = "启动失败: " + e.message; }
}

function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

// 字符级 diff：取公共前后缀，高亮中间被修改的部分
function diffSpans(a, b, cls) {
  let s = 0; while (s < a.length && s < b.length && a[s] === b[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea-1] === b[eb-1]) { ea--; eb--; }
  return esc(a.slice(0,s)) + '<span class="' + cls + '">' + esc(a.slice(s,ea)) + "</span>" + esc(a.slice(ea));
}

function render(d) {
  status.textContent = d.running
    ? `运行中 · ${d.elapsed}s · 完成 ${Object.keys(terminalOf(d)).length}/${TOTAL_NODES} 节点`
    : (d.report_ready ? `完成 · exit=${d.exit_code}` : "待机 — 等待指令");
  bar.style.width = `${Math.min(100, Object.keys(terminalOf(d)).length / TOTAL_NODES * 100)}%`;
  if (d.log_tail?.length) log.textContent = d.log_tail.join("\n");

  const t = terminalOf(d);
  let html = "";
  for (const [doc, info] of Object.entries(d.docs)) {
    html += `<div class="doc"><b>${esc(doc)}</b><br>`;
    for (const [nid, e] of Object.entries(info.nodes)) {
      let cls = e.status, label = e.status;
      if (e.status === "OK" && e.repaired) { label = "REPAIRED"; cls = "REPAIRED"; }
      if (e.status === "OK" && e.repaired === false && e.action === undefined) { cls = "OK"; }
      if (e.action === "RETRY") { cls = "RETRY"; label = "RETRY"; }
      html += `<span class="chip ${cls}">${esc(nid)} ${esc(label)}</span>`;
    }
    html += `</div>`;
  }
  docs.innerHTML = html || `<span style="color:var(--dim)">运行后在此显示各节点状态</span>`;

  const repairs = Object.values(t).filter(e => e.repaired);
  if (repairs.length) {
    repairCard.classList.remove("hide");
    document.getElementById("repairs").innerHTML = repairs.map(e => {
      const a = e.original ?? "", b = e.latex ?? "";
      return `<div style="margin:14px 0">
      <div class="editor">
        <div class="pane">
          <div class="pane-head"><span>修复前 · original.tex</span><span class="pill fail" id="po-${esc(e.node_id)}">编译检查中…</span></div>
          <div class="pane-body">
            <div class="codeline"><span class="gutter">1</span><span>${diffSpans(a, b, "del")}</span></div>
            <div class="mathbox bad" id="mo-${esc(e.node_id)}"></div>
          </div>
        </div>
        <div class="pane">
          <div class="pane-head"><span>修复后 · repaired.tex</span><span class="pill pass" id="pr-${esc(e.node_id)}">编译检查中…</span></div>
          <div class="pane-body">
            <div class="codeline"><span class="gutter">1</span><span>${diffSpans(a, b, "add")}</span></div>
            <div class="mathbox good" id="mr-${esc(e.node_id)}"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${e.evidence ? `<img class="crop" src="/api/crops/${esc(e.evidence.replace("crops/",""))}?token=${T}" title="原始截图证据">` : "⚠️ 缺证据"}
        <span style="color:var(--dim);font-size:13px">SymPy 回判通过 · ${esc(e.provider ?? "")} · ${esc(String(e.attempts ?? ""))} 次</span>
        <div id="renderwrap-${esc(e.node_id)}" class="renderwrap hide"></div>
        <div id="render-${esc(e.node_id)}" style="color:var(--dim);font-size:13px">LaTeX 编译检查中…</div>
      </div></div>`;
    }).join("");
    for (const e of repairs) {
      try {
        if (window.katex) {
          katex.render(e.original ?? "", document.getElementById("mo-" + e.node_id), { throwOnError: false });
          katex.render(e.latex ?? "", document.getElementById("mr-" + e.node_id), { throwOnError: false });
        }
      } catch (_) {}
      fetchRender(e.node_id);
    }
  }
  if (d.report_ready && !d.running && !doneShown) {
    doneShown = true;
    fetch(`/api/report?token=${T}`).then(r => r.text()).then(md => {
      document.getElementById("report").textContent = md;
      reportCard.classList.remove("hide");
      reportCard.scrollIntoView({ behavior: "smooth" });
    });
  }
}
function terminalOf(d){ const t={}; for(const [,info] of Object.entries(d.docs)) for(const [nid,e] of Object.entries(info.nodes)) if(e.status) t[nid]=e; return t; }

const renderCache = {};
async function fetchRender(nid) {
  const box = document.getElementById("render-" + nid);
  if (!box || renderCache[nid]) return;
  try {
    const d = await j(`/api/render/${nid}?token=${T}`);
    renderCache[nid] = d;
    const po = document.getElementById("po-" + nid), pr = document.getElementById("pr-" + nid);
    po.textContent = "编译 " + (d.orig_ok ? "✓" : "✗"); po.className = "pill " + (d.orig_ok ? "pass" : "fail");
    pr.textContent = "编译 " + (d.rep_ok ? "✓" : "✗"); pr.className = "pill " + (d.rep_ok ? "pass" : "fail");
    if (d.img) {
      const wrap = document.getElementById("renderwrap-" + nid);
      wrap.classList.remove("hide");
      wrap.innerHTML = `<img src="${esc(d.img)}?token=${T}">`;
    }
    box.textContent = "";
  } catch (e) {
    box.textContent = "LaTeX 编译检查失败";
  }
}

async function loop(){ try { render(await j(`/api/status?token=${T}`)); } catch(e){} }
nodeinfo(); loop(); setInterval(nodeinfo, 5000); setInterval(loop, 1000);
</script>
</body>
</html>
